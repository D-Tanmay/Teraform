trigger:
  branches:
    include:
      - main4

pr:
  branches:
    include:
      - main4

variables:
  terraformVersion: '1.9.0'
  tfWorkingDirectory: 'Terraform'
  planFile: '$(Pipeline.Workspace)/terraform.plan'

stages:
- stage: TerraformPlan
  displayName: 'Terraform Plan'
  jobs:
  - job: Plan
    displayName: 'Run Terraform init/validate/plan'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - task: Bash@3
      displayName: 'Install Terraform'
      inputs:
        targetType: 'inline'
        script: |
          sudo apt-get update -y
          sudo apt-get install -y unzip curl
          curl -fsSL https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip -o terraform.zip
          unzip -o terraform.zip
          sudo mv terraform /usr/local/bin/
          terraform version

    - task: Bash@3
      displayName: 'Terraform init'
      inputs:
        targetType: 'inline'
        script: |
          cd $(tfWorkingDirectory)
          terraform init

    - task: Bash@3
      displayName: 'Terraform validate'
      inputs:
        targetType: 'inline'
        script: |
          cd $(tfWorkingDirectory)
          terraform validate

    - task: Bash@3
      displayName: 'Terraform plan'
      inputs:
        targetType: 'inline'
        script: |
          cd $(tfWorkingDirectory)
          terraform plan -out="$(planFile)"

- stage: TerraformApply
  displayName: 'Terraform Apply'
  dependsOn: TerraformPlan
  condition: succeeded()
  jobs:
  - job: Apply
    displayName: 'Apply Terraform'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - task: Bash@3
      displayName: 'Install Terraform'
      inputs:
        targetType: 'inline'
        script: |
          sudo apt-get update -y
          sudo apt-get install -y unzip curl
          curl -fsSL https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip -o terraform.zip
          unzip -o terraform.zip
          sudo mv terraform /usr/local/bin/
          terraform version

    - task: Bash@3
      displayName: 'Terraform apply'
      inputs:
        targetType: 'inline'
        script: |
          cd $(tfWorkingDirectory)
          terraform apply -auto-approve "$(planFile)"

- stage: TerraformDestroy
  displayName: 'Terraform Destroy'
  dependsOn: TerraformApply
  condition: succeeded()
  jobs:
  - job: Destroy
    displayName: 'Destroy Terraform resources'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - task: Bash@3
      displayName: 'Install Terraform'
      inputs:
        targetType: 'inline'
        script: |
          sudo apt-get update -y
          sudo apt-get install -y unzip curl
          curl -fsSL https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip -o terraform.zip
          unzip -o terraform.zip
          sudo mv terraform /usr/local/bin/
          terraform version

    - task: Bash@3
      displayName: 'Terraform destroy'
      inputs:
        targetType: 'inline'
        script: |
          cd $(tfWorkingDirectory)
          terraform destroy -auto-approve
