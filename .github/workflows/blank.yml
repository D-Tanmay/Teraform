name: Terraform CI/CD

# ─────────────────────────────────────────────────────────────────────────────
# HOW TO USE
# ─────────────────────────────────────────────────────────────────────────────
#
# Secrets required in GitHub → Settings → Secrets → Actions:
#
#   AZURE_CLIENT_ID
#   AZURE_CLIENT_SECRET
#   AZURE_TENANT_ID
#   AZURE_SUBSCRIPTION_ID
#   AZURE_VM_PASSWORD
#
# Usage:
#
#   action = plan
#     → Runs setup + terraform plan only
#
#   action = apply
#     → Runs setup + plan → waits for approval → apply
#
#   action = destroy
#     → Runs setup + destroy plan → waits for approval → destroy
#
# GitHub approval gates:
#
#   Repo → Settings → Environments
#
# Create environments:
#
#   apply
#   destroy
#
# Add required reviewers there.
#
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:

      tf_file:
        description: >
          Terraform file to target — filename only
          Example: vm.tf or network.tf
        required: true
        type: string

      action:
        description: "Terraform action to run"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: terraform-${{ github.event.inputs.tf_file }}
  cancel-in-progress: false

env:
  TF_FILE: ${{ github.event.inputs.tf_file }}
  ACTION: ${{ github.event.inputs.action }}

  WS_DIR: /home/runner/isolated-tf

  BACKEND_RG: tfstate-day04
  BACKEND_SA: day0417691
  BACKEND_CONTAINER: tfstate

  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  TF_VAR_admin_password: ${{ secrets.AZURE_VM_PASSWORD }}

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # PLAN JOB
  # ───────────────────────────────────────────────────────────────────────────

  plan:
    name: "Plan → ${{ github.event.inputs.tf_file }}"
    runs-on: ubuntu-latest

    outputs:
      artifact-name: ${{ steps.artifact-name.outputs.value }}

    steps:

      # ───────────────────────────────────────────────────────────────────────
      # CHECKOUT
      # ───────────────────────────────────────────────────────────────────────

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ───────────────────────────────────────────────────────────────────────
      # VALIDATE SECRETS
      # ───────────────────────────────────────────────────────────────────────

      - name: Validate secrets
        shell: bash
        run: |

          missing=()

          [[ -z "$ARM_CLIENT_ID" ]] && missing+=("AZURE_CLIENT_ID")
          [[ -z "$ARM_CLIENT_SECRET" ]] && missing+=("AZURE_CLIENT_SECRET")
          [[ -z "$ARM_TENANT_ID" ]] && missing+=("AZURE_TENANT_ID")
          [[ -z "$ARM_SUBSCRIPTION_ID" ]] && missing+=("AZURE_SUBSCRIPTION_ID")
          [[ -z "$TF_VAR_admin_password" ]] && missing+=("AZURE_VM_PASSWORD")

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: Missing secrets:"
            for s in "${missing[@]}"; do
              echo "  - $s"
            done
            exit 1
          fi

          echo "OK: All secrets present."

      # ───────────────────────────────────────────────────────────────────────
      # VALIDATE TF FILE
      # ───────────────────────────────────────────────────────────────────────

      - name: Validate selected file
        shell: bash
        run: |

          if [[ "$TF_FILE" != *.tf ]]; then
            echo "ERROR: '$TF_FILE' does not end in .tf"
            exit 1
          fi

          if [[ "$TF_FILE" == */* ]] || [[ "$TF_FILE" == *..* ]]; then
            echo "ERROR: Invalid filename."
            exit 1
          fi

          if [[ ! -f "Terraform/$TF_FILE" ]]; then
            echo "ERROR: File not found: Terraform/$TF_FILE"

            echo "Available files:"
            find Terraform/ -maxdepth 1 -name "*.tf" | sort | sed 's|Terraform/||'

            exit 1
          fi

          echo "OK: Terraform file found."

      # ───────────────────────────────────────────────────────────────────────
      # ENSURE GITIGNORE
      # ───────────────────────────────────────────────────────────────────────

      - name: Ensure Terraform/.gitignore exists
        shell: bash
        run: |

          GITIGNORE="Terraform/.gitignore"

          touch "$GITIGNORE"

          entries=(
            ".terraform/"
            ".terraform.lock.hcl"
            "*.tfplan"
            "*.tfstate"
            "*.tfstate.backup"
            "crash.log"
            "override.tf"
            "override.tf.json"
          )

          for entry in "${entries[@]}"; do
            grep -qxF "$entry" "$GITIGNORE" || echo "$entry" >> "$GITIGNORE"
          done

      # ───────────────────────────────────────────────────────────────────────
      # BUILD ISOLATED WORKSPACE
      # ───────────────────────────────────────────────────────────────────────

      - name: Build isolated workspace
        shell: bash
        run: |

          mkdir -p "$WS_DIR"

          cp "Terraform/$TF_FILE" "$WS_DIR/"

          for shared in provider.tf versions.tf variables.tf; do
            if [[ -f "Terraform/$shared" ]] && [[ "$shared" != "$TF_FILE" ]]; then
              cp "Terraform/$shared" "$WS_DIR/"
            fi
          done

          for tfvars in Terraform/*.tfvars Terraform/*.tfvars.json; do
            [[ -f "$tfvars" ]] && cp "$tfvars" "$WS_DIR/"
          done

          echo "Workspace contents:"
          ls -lh "$WS_DIR/"

      # ───────────────────────────────────────────────────────────────────────
      # INSTALL AZURE CLI
      # ───────────────────────────────────────────────────────────────────────

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      # ───────────────────────────────────────────────────────────────────────
      # SETUP TERRAFORM
      # ───────────────────────────────────────────────────────────────────────

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.9.7"

      # ───────────────────────────────────────────────────────────────────────
      # AZURE LOGIN
      # ───────────────────────────────────────────────────────────────────────

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # ───────────────────────────────────────────────────────────────────────
      # BOOTSTRAP BACKEND
      # ───────────────────────────────────────────────────────────────────────

      - name: Bootstrap Terraform backend
        shell: bash
        run: |

          az group create \
            --name "$BACKEND_RG" \
            --location westeurope

          az storage account create \
            --resource-group "$BACKEND_RG" \
            --name "$BACKEND_SA" \
            --sku Standard_LRS \
            --kind StorageV2 \
            --location westeurope \
            --allow-blob-public-access false

          ACCOUNT_KEY=$(az storage account keys list \
            --resource-group "$BACKEND_RG" \
            --account-name "$BACKEND_SA" \
            --query '[0].value' \
            --output tsv)

          az storage container create \
            --name "$BACKEND_CONTAINER" \
            --account-name "$BACKEND_SA" \
            --account-key "$ACCOUNT_KEY"

      # ───────────────────────────────────────────────────────────────────────
      # TERRAFORM INIT
      # ───────────────────────────────────────────────────────────────────────

      - name: Terraform init
        working-directory: ${{ env.WS_DIR }}
        shell: bash
        run: |

          STATE_KEY="${TF_FILE%.tf}.tfstate"

          terraform init -reconfigure \
            -backend-config="resource_group_name=$BACKEND_RG" \
            -backend-config="storage_account_name=$BACKEND_SA" \
            -backend-config="container_name=$BACKEND_CONTAINER" \
            -backend-config="key=$STATE_KEY"

      # ───────────────────────────────────────────────────────────────────────
      # AUTO FORMAT
      # ───────────────────────────────────────────────────────────────────────

      - name: Terraform format (auto-fix)
        working-directory: ${{ env.WS_DIR }}
        shell: bash
        run: |

          echo "Running terraform fmt..."
          terraform fmt -recursive

          echo "Copying formatted files back..."
          cp -f *.tf "$GITHUB_WORKSPACE/Terraform/" 2>/dev/null || true

          cd "$GITHUB_WORKSPACE"

          git add Terraform/

          if git diff --cached --quiet; then
            echo "OK: No formatting changes."
          else

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git commit -m "style: auto-format terraform files [skip ci]"

            git push
          fi

      # ───────────────────────────────────────────────────────────────────────
      # VALIDATE
      # ───────────────────────────────────────────────────────────────────────

      - name: Terraform validate
        working-directory: ${{ env.WS_DIR }}
        run: terraform validate

      # ───────────────────────────────────────────────────────────────────────
      # PLAN
      # ───────────────────────────────────────────────────────────────────────

      - name: Terraform plan
        working-directory: ${{ env.WS_DIR }}
        shell: bash
        run: |

          if [[ "$ACTION" == "destroy" ]]; then
            terraform plan -destroy -out=plan.tfplan
          else
            terraform plan -out=plan.tfplan
          fi

      # ───────────────────────────────────────────────────────────────────────
      # ARTIFACT NAME
      # ───────────────────────────────────────────────────────────────────────

      - name: Set artifact name
        id: artifact-name
        shell: bash
        run: |

          ARTIFACT="tfplan-${{ github.run_id }}-${TF_FILE%.tf}"

          echo "value=$ARTIFACT" >> "$GITHUB_OUTPUT"

      # ───────────────────────────────────────────────────────────────────────
      # UPLOAD PLAN
      # ───────────────────────────────────────────────────────────────────────

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.value }}
          retention-days: 1
          path: ${{ env.WS_DIR }}/plan.tfplan

  # ───────────────────────────────────────────────────────────────────────────
  # APPLY / DESTROY JOB
  # ───────────────────────────────────────────────────────────────────────────

  apply:
    name: "${{ github.event.inputs.action }} → ${{ github.event.inputs.tf_file }}"
    runs-on: ubuntu-latest

    needs: plan

    if: github.event.inputs.action != 'plan'

    environment: ${{ github.event.inputs.action }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build isolated workspace
        shell: bash
        run: |

          mkdir -p "$WS_DIR"

          cp "Terraform/$TF_FILE" "$WS_DIR/"

          for shared in provider.tf versions.tf variables.tf; do
            if [[ -f "Terraform/$shared" ]] && [[ "$shared" != "$TF_FILE" ]]; then
              cp "Terraform/$shared" "$WS_DIR/"
            fi
          done

          for tfvars in Terraform/*.tfvars Terraform/*.tfvars.json; do
            [[ -f "$tfvars" ]] && cp "$tfvars" "$WS_DIR/"
          done

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.9.7"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Terraform init
        working-directory: ${{ env.WS_DIR }}
        shell: bash
        run: |

          STATE_KEY="${TF_FILE%.tf}.tfstate"

          terraform init -reconfigure \
            -backend-config="resource_group_name=$BACKEND_RG" \
            -backend-config="storage_account_name=$BACKEND_SA" \
            -backend-config="container_name=$BACKEND_CONTAINER" \
            -backend-config="key=$STATE_KEY"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.artifact-name }}
          path: ${{ env.WS_DIR }}

      - name: Terraform apply
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.WS_DIR }}
        run: terraform apply -auto-approve plan.tfplan

      - name: Terraform destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: ${{ env.WS_DIR }}
        run: terraform apply -auto-approve plan.tfplan
