name: Terraform CI/CD

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose Terraform action"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

concurrency:
  group: terraform-main4
  cancel-in-progress: false

jobs:

  terraform:
    name: Terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest

    environment: ${{ github.event.inputs.action }}

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Azure CLI
      run: |
        curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: '1.9.7'

    - name: Validate Azure secrets
      shell: bash
      run: |
        if [ -z "$ARM_CLIENT_ID" ]; then echo "Missing ARM_CLIENT_ID"; exit 1; fi
        if [ -z "$ARM_CLIENT_SECRET" ]; then echo "Missing ARM_CLIENT_SECRET"; exit 1; fi
        if [ -z "$ARM_TENANT_ID" ]; then echo "Missing ARM_TENANT_ID"; exit 1; fi
        if [ -z "$ARM_SUBSCRIPTION_ID" ]; then echo "Missing ARM_SUBSCRIPTION_ID"; exit 1; fi

    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

    - name: Bootstrap Terraform Backend
      shell: bash
      run: |

        RESOURCE_GROUP="tfstate-day04"
        STORAGE_ACCOUNT="day0417691"
        CONTAINER="tfstate"
        LOCATION="westeurope"

        echo "Creating resource group if not exists..."
        az group create \
          --name $RESOURCE_GROUP \
          --location $LOCATION

        echo "Creating storage account if not exists..."
        az storage account create \
          --resource-group $RESOURCE_GROUP \
          --name $STORAGE_ACCOUNT \
          --sku Standard_LRS \
          --kind StorageV2 \
          --location $LOCATION

        echo "Fetching storage key..."
        ACCOUNT_KEY=$(az storage account keys list \
          --resource-group $RESOURCE_GROUP \
          --account-name $STORAGE_ACCOUNT \
          --query '[0].value' -o tsv)

        echo "Creating blob container if not exists..."
        az storage container create \
          --name $CONTAINER \
          --account-name $STORAGE_ACCOUNT \
          --account-key $ACCOUNT_KEY

    - name: Terraform Init
      working-directory: Terraform
      run: |
        terraform init -reconfigure \
          -backend-config="resource_group_name=tfstate-day04" \
          -backend-config="storage_account_name=day0417691" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=terraform.tfstate"

    - name: Terraform Format Check
      working-directory: Terraform
      run: terraform fmt -check -recursive

    - name: Terraform Validate
      working-directory: Terraform
      run: terraform validate

    #################################################################
    # PLAN
    #################################################################

    - name: Terraform Plan
      if: github.event.inputs.action == 'plan'
      working-directory: Terraform
      run: |
        terraform plan -out=plan.tfplan

    - name: Upload Plan Artifact
      if: github.event.inputs.action == 'plan'
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan
        path: Terraform/plan.tfplan

    #################################################################
    # APPLY
    #################################################################

    - name: Download Plan Artifact
      if: github.event.inputs.action == 'apply'
      uses: actions/download-artifact@v4
      with:
        name: terraform-plan
        path: Terraform

    - name: Terraform Apply
      if: github.event.inputs.action == 'apply'
      working-directory: Terraform
      run: |
        terraform apply -auto-approve plan.tfplan

    #################################################################
    # DESTROY
    #################################################################

    - name: Terraform Destroy
      if: github.event.inputs.action == 'destroy'
      working-directory: Terraform
      run: |
        terraform destroy -auto-approve
