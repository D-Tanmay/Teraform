name: Terraform CI/CD

# ─────────────────────────────────────────────────────────────────────────────
# HOW TO USE
# ─────────────────────────────────────────────────────────────────────────────
#
#  Step 1 — Add these secrets in GitHub → Settings → Secrets → Actions:
#           AZURE_CLIENT_ID
#           AZURE_CLIENT_SECRET
#           AZURE_TENANT_ID
#           AZURE_SUBSCRIPTION_ID
#           AZURE_VM_PASSWORD   ← VM admin password (min 12 chars,
#                                  upper+lower+number+special required by Azure)
#
#  Step 2 — Go to Actions → Terraform CI/CD → Run workflow
#           tf_file : type the filename e.g. vm.tf or network.tf
#           action  : pick plan / apply / destroy
#
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:

      tf_file:
        description: >
          Terraform file to target — filename only, e.g. vm.tf or network.tf
          (must exist inside the Terraform/ directory)
        required: true
        type: string

      action:
        description: "Terraform action to run against the selected file"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: write

concurrency:
  group: terraform-${{ github.event.inputs.tf_file }}
  cancel-in-progress: false

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — List available .tf files (shown in the run summary for reference)
  # ───────────────────────────────────────────────────────────────────────────
  list-tf-files:
    name: Available Terraform files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List .tf files in Terraform/
        shell: bash
        run: |
          echo "## Available .tf files in Terraform/" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          files=$(find Terraform/ -maxdepth 1 -name "*.tf" | sort)

          if [[ -z "$files" ]]; then
            echo "_No .tf files found._" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| File | Size |" >> "$GITHUB_STEP_SUMMARY"
            echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r f; do
              size=$(du -sh "$f" | cut -f1)
              name=$(basename "$f")
              echo "| \`$name\` | $size |" >> "$GITHUB_STEP_SUMMARY"
            done <<< "$files"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Selected:** \`${{ github.event.inputs.tf_file }}\`  →  \`${{ github.event.inputs.action }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Run Terraform against the selected file
  # ───────────────────────────────────────────────────────────────────────────
  terraform:
    name: "${{ github.event.inputs.action }} → ${{ github.event.inputs.tf_file }}"
    runs-on: ubuntu-latest
    needs: list-tf-files

    environment: ${{ github.event.inputs.action }}

    env:
      ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Terraform variable injection ─────────────────────────────────────
      # Any TF_VAR_* env var is automatically picked up by Terraform as the
      # matching input variable — no interactive prompt, no tfvars file needed.
      # TF_VAR_admin_password → var.admin_password in your .tf file.
      # Add AZURE_VM_PASSWORD in GitHub → Settings → Secrets → Actions.
      TF_VAR_admin_password: ${{ secrets.AZURE_VM_PASSWORD }}

      TF_FILE: ${{ github.event.inputs.tf_file }}
      ACTION:  ${{ github.event.inputs.action }}
      WS_DIR:  /home/runner/isolated-tf

    steps:

      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Validate secrets ─────────────────────────────────────────────────
      # Check AZURE_VM_PASSWORD specifically so we get a clear error message
      # instead of Terraform hanging on an interactive prompt
      - name: Validate Azure secrets
        shell: bash
        run: |
          missing=()
          [[ -z "$ARM_CLIENT_ID"            ]] && missing+=("AZURE_CLIENT_ID")
          [[ -z "$ARM_CLIENT_SECRET"        ]] && missing+=("AZURE_CLIENT_SECRET")
          [[ -z "$ARM_TENANT_ID"            ]] && missing+=("AZURE_TENANT_ID")
          [[ -z "$ARM_SUBSCRIPTION_ID"      ]] && missing+=("AZURE_SUBSCRIPTION_ID")
          [[ -z "$TF_VAR_admin_password"    ]] && missing+=("AZURE_VM_PASSWORD")

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: The following secrets are missing from GitHub Actions:"
            for s in "${missing[@]}"; do
              echo "  - $s"
            done
            echo ""
            echo "Go to: GitHub repo → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

          echo "OK: All secrets present."

      # ── Validate selected file ───────────────────────────────────────────
      - name: Validate selected file
        shell: bash
        run: |
          if [[ "$TF_FILE" != *.tf ]]; then
            echo "ERROR: '$TF_FILE' does not end in .tf"
            exit 1
          fi

          if [[ "$TF_FILE" == */* ]] || [[ "$TF_FILE" == *..* ]]; then
            echo "ERROR: Filename must not contain slashes or '..'"
            exit 1
          fi

          if [[ ! -f "Terraform/$TF_FILE" ]]; then
            echo "ERROR: 'Terraform/$TF_FILE' not found."
            echo ""
            echo "Available .tf files:"
            find Terraform/ -maxdepth 1 -name "*.tf" | sort | sed 's|Terraform/||'
            exit 1
          fi

          echo "OK: 'Terraform/$TF_FILE' found."

      # ── Ensure .gitignore excludes provider cache ────────────────────────
      - name: Ensure Terraform/.gitignore excludes provider cache
        shell: bash
        run: |
          GITIGNORE="Terraform/.gitignore"
          touch "$GITIGNORE"

          entries=(
            ".terraform/"
            ".terraform.lock.hcl"
            "*.tfplan"
            "*.tfstate"
            "*.tfstate.backup"
            "crash.log"
            "override.tf"
            "override.tf.json"
          )

          for entry in "${entries[@]}"; do
            if ! grep -qxF "$entry" "$GITIGNORE"; then
              echo "$entry" >> "$GITIGNORE"
            fi
          done
          echo "OK: .gitignore is up to date."

      # ── Build isolated workspace ─────────────────────────────────────────
      - name: Build isolated workspace
        shell: bash
        run: |
          mkdir -p "$WS_DIR"

          echo "Copying selected file: Terraform/$TF_FILE"
          cp "Terraform/$TF_FILE" "$WS_DIR/"

          # Copy shared configs that every .tf file depends on
          for shared in provider.tf versions.tf variables.tf; do
            if [[ -f "Terraform/$shared" ]] && [[ "$shared" != "$TF_FILE" ]]; then
              echo "Copying shared config: $shared"
              cp "Terraform/$shared" "$WS_DIR/"
            fi
          done

          # Copy .tfvars if present
          for tfvars in Terraform/*.tfvars Terraform/*.tfvars.json; do
            if [[ -f "$tfvars" ]]; then
              echo "Copying tfvars: $(basename $tfvars)"
              cp "$tfvars" "$WS_DIR/"
            fi
          done

          echo ""
          echo "Isolated workspace contents:"
          ls -lh "$WS_DIR/"

      # ── Azure CLI ────────────────────────────────────────────────────────
      - name: Install Azure CLI
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      # ── Terraform ────────────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.9.7"

      # ── Azure login ───────────────────────────────────────────────────────
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":       "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":   "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":       "${{ secrets.AZURE_TENANT_ID }}"
            }

      # ── Bootstrap backend ─────────────────────────────────────────────────
      - name: Bootstrap Terraform backend
        shell: bash
        env:
          RESOURCE_GROUP:  tfstate-day04
          STORAGE_ACCOUNT: day0417691
          CONTAINER:       tfstate
          LOCATION:        westeurope
        run: |
          az group create --name "$RESOURCE_GROUP" --location "$LOCATION"

          az storage account create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$STORAGE_ACCOUNT" \
            --sku Standard_LRS \
            --kind StorageV2 \
            --location "$LOCATION"

          ACCOUNT_KEY=$(az storage account keys list \
            --resource-group "$RESOURCE_GROUP" \
            --account-name "$STORAGE_ACCOUNT" \
            --query '[0].value' \
            --output tsv)

          az storage container create \
            --name "$CONTAINER" \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$ACCOUNT_KEY"

      # ── Terraform init ────────────────────────────────────────────────────
      - name: Terraform init
        working-directory: ${{ env.WS_DIR }}
        shell: bash
        run: |
          STATE_KEY="${TF_FILE%.tf}.tfstate"
          echo "Using state key: $STATE_KEY"

          terraform init -reconfigure \
            -backend-config="resource_group_name=tfstate-day04" \
            -backend-config="storage_account_name=day0417691" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=$STATE_KEY"

      # ── Terraform format (auto-fix + commit) ──────────────────────────────
      - name: Terraform format (auto-fix)
        working-directory: ${{ env.WS_DIR }}
        shell: bash
        run: |
          terraform fmt -recursive

          cd "$GITHUB_WORKSPACE"
          git add -- "Terraform/$TF_FILE"

          if git diff --cached --quiet; then
            echo "OK: No formatting changes needed."
          else
            echo "Auto-fixed formatting in: $TF_FILE"
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "style: auto-format $TF_FILE [skip ci]"
            git push
          fi

      # ── Terraform validate ────────────────────────────────────────────────
      - name: Terraform validate
        working-directory: ${{ env.WS_DIR }}
        run: terraform validate

      # ── Plan ──────────────────────────────────────────────────────────────
      - name: Terraform plan
        if: env.ACTION == 'plan'
        working-directory: ${{ env.WS_DIR }}
        run: terraform plan -out=plan.tfplan

      - name: Upload plan artifact
        if: env.ACTION == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.event.inputs.tf_file }}
          path: ${{ env.WS_DIR }}/plan.tfplan

      # ── Apply ─────────────────────────────────────────────────────────────
      - name: Download plan artifact
        if: env.ACTION == 'apply'
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.event.inputs.tf_file }}
          path: ${{ env.WS_DIR }}

      - name: Terraform apply
        if: env.ACTION == 'apply'
        working-directory: ${{ env.WS_DIR }}
        run: terraform apply -auto-approve plan.tfplan

      # ── Destroy ───────────────────────────────────────────────────────────
      - name: Terraform destroy
        if: env.ACTION == 'destroy'
        working-directory: ${{ env.WS_DIR }}
        run: terraform destroy -auto-approve

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "## Terraform run summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **File** | \`$TF_FILE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Action** | \`$ACTION\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **State key** | \`${TF_FILE%.tf}.tfstate\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | \`${{ github.actor }}\` |" >> "$GITHUB_STEP_SUMMARY"
