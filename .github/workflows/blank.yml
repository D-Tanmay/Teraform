name: Terraform CI/CD

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose Terraform action"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

# Need write permission so the workflow can commit fmt fixes back to the branch
permissions:
  contents: write

concurrency:
  group: terraform-main4
  cancel-in-progress: false

jobs:

  terraform:
    name: Terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest

    environment: ${{ github.event.inputs.action }}

    env:
      ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    defaults:
      run:
        working-directory: Terraform

    steps:

      # ── Checkout ──────────────────────────────────────────────────────────
      # fetch-depth: 0 needed so we can push commits back
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── GUARDRAIL: No stray non-Terraform files in Terraform/ ─────────────
      - name: Check Terraform directory contains only .tf files
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          bad_files=$(find Terraform/ -maxdepth 1 -type f \
            ! -name "*.tf" \
            ! -name "*.tfvars" \
            ! -name "*.terraform.lock.hcl")

          if [[ -n "$bad_files" ]]; then
            echo "ERROR: Non-Terraform files found inside Terraform/:"
            echo "$bad_files"
            echo ""
            echo "Terraform will try to parse these as HCL and fail."
            echo "GitHub Actions workflows belong in: .github/workflows/"
            exit 1
          fi

          echo "OK: Terraform directory is clean."

      # ── Azure CLI ─────────────────────────────────────────────────────────
      - name: Install Azure CLI
        working-directory: ${{ github.workspace }}
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      # ── Terraform ─────────────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.9.7"

      # ── Validate secrets ──────────────────────────────────────────────────
      - name: Validate Azure secrets
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          missing=()
          [[ -z "$ARM_CLIENT_ID"       ]] && missing+=("ARM_CLIENT_ID")
          [[ -z "$ARM_CLIENT_SECRET"   ]] && missing+=("ARM_CLIENT_SECRET")
          [[ -z "$ARM_TENANT_ID"       ]] && missing+=("ARM_TENANT_ID")
          [[ -z "$ARM_SUBSCRIPTION_ID" ]] && missing+=("ARM_SUBSCRIPTION_ID")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing secrets: ${missing[*]}"
            exit 1
          fi
          echo "OK: All required Azure secrets are present."

      # ── Azure login ───────────────────────────────────────────────────────
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":       "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":   "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":       "${{ secrets.AZURE_TENANT_ID }}"
            }

      # ── Bootstrap backend ─────────────────────────────────────────────────
      - name: Bootstrap Terraform backend
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          RESOURCE_GROUP:  tfstate-day04
          STORAGE_ACCOUNT: day0417691
          CONTAINER:       tfstate
          LOCATION:        westeurope
        run: |
          az group create \
            --name "$RESOURCE_GROUP" \
            --location "$LOCATION"

          az storage account create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$STORAGE_ACCOUNT" \
            --sku Standard_LRS \
            --kind StorageV2 \
            --location "$LOCATION"

          ACCOUNT_KEY=$(az storage account keys list \
            --resource-group "$RESOURCE_GROUP" \
            --account-name "$STORAGE_ACCOUNT" \
            --query '[0].value' \
            --output tsv)

          az storage container create \
            --name "$CONTAINER" \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$ACCOUNT_KEY"

      # ── Terraform init ────────────────────────────────────────────────────
      - name: Terraform init
        run: |
          terraform init -reconfigure \
            -backend-config="resource_group_name=tfstate-day04" \
            -backend-config="storage_account_name=day0417691" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=terraform.tfstate"

      # ── Terraform format (auto-fix + commit back) ─────────────────────────
      # Instead of `fmt -check` (which just fails), we run `fmt` to fix issues
      # in place, then commit and push the changes back to the branch.
      # If everything was already formatted, nothing is committed.
      - name: Terraform format (auto-fix)
        shell: bash
        run: |
          terraform fmt -recursive

          # Check if fmt changed anything
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Formatting issues were found and auto-fixed."
            echo "The following files were reformatted:"
            git diff --name-only

            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: auto-format Terraform files [skip ci]"
            git push
            echo ""
            echo "Fixes committed. Continuing pipeline with formatted code."
          else
            echo "OK: All Terraform files are properly formatted."
          fi

      # ── Terraform validate ────────────────────────────────────────────────
      - name: Terraform validate
        run: terraform validate

      # ── Plan ──────────────────────────────────────────────────────────────
      - name: Terraform plan
        if: github.event.inputs.action == 'plan'
        run: terraform plan -out=plan.tfplan

      - name: Upload plan artifact
        if: github.event.inputs.action == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: Terraform/plan.tfplan

      # ── Apply ─────────────────────────────────────────────────────────────
      - name: Download plan artifact
        if: github.event.inputs.action == 'apply'
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: Terraform

      - name: Terraform apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve plan.tfplan

      # ── Destroy ───────────────────────────────────────────────────────────
      - name: Terraform destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve
