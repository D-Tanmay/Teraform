name: Terraform CI/CD

on:
  workflow_dispatch:
    inputs:
      tf_file:
        description: "Terraform file inside terraform/ folder"
        required: true
        default: "vm.tf"

      action:
        description: "Terraform action"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: write

concurrency:
  group: terraform-${{ github.event.inputs.tf_file }}
  cancel-in-progress: false

env:
  TF_FILE:               ${{ github.event.inputs.tf_file }}
  ACTION:                ${{ github.event.inputs.action }}

  WS_DIR:                /home/runner/isolated-tf

  BACKEND_RG:            tfstate-day04
  BACKEND_SA:            day0417691
  BACKEND_CONTAINER:     tfstate

  ARM_CLIENT_ID:         ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET:     ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID:         ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID:   ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  TF_VAR_admin_password: ${{ secrets.AZURE_VM_PASSWORD }}

jobs:

# ─────────────────────────────────────────────────────────────────────────────
# PLAN
# ─────────────────────────────────────────────────────────────────────────────
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    outputs:
      artifact-name: ${{ steps.artifact-name.outputs.value }}

    steps:

      # ───────────────────────────────────────────────────────────────────────
      # Checkout
      # ───────────────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ───────────────────────────────────────────────────────────────────────
      # Debug repository structure
      # ───────────────────────────────────────────────────────────────────────
      - name: Debug repository structure
        shell: bash
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository contents:"
          ls -lah

          echo ""
          echo "terraform folder:"
          ls -lah terraform || true

      # ───────────────────────────────────────────────────────────────────────
      # Validate secrets
      # ───────────────────────────────────────────────────────────────────────
      - name: Validate secrets
        shell: bash
        run: |
          set -e

          missing=()

          [[ -z "$ARM_CLIENT_ID" ]] && missing+=("AZURE_CLIENT_ID")
          [[ -z "$ARM_CLIENT_SECRET" ]] && missing+=("AZURE_CLIENT_SECRET")
          [[ -z "$ARM_TENANT_ID" ]] && missing+=("AZURE_TENANT_ID")
          [[ -z "$ARM_SUBSCRIPTION_ID" ]] && missing+=("AZURE_SUBSCRIPTION_ID")
          [[ -z "$TF_VAR_admin_password" ]] && missing+=("AZURE_VM_PASSWORD")

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing secrets:"
            printf '%s\n' "${missing[@]}"
            exit 1
          fi

          echo "All secrets validated."

      # ───────────────────────────────────────────────────────────────────────
      # Validate TF file
      # ───────────────────────────────────────────────────────────────────────
      - name: Validate selected file
        shell: bash
        run: |
          set -e

          echo "TF_FILE=$TF_FILE"

          if [[ "$TF_FILE" != *.tf ]]; then
            echo "ERROR: TF_FILE must end with .tf"
            exit 1
          fi

          if [[ "$TF_FILE" == */* ]] || [[ "$TF_FILE" == *..* ]]; then
            echo "ERROR: Invalid TF_FILE"
            exit 1
          fi

          if [[ ! -f "terraform/$TF_FILE" ]]; then
            echo "ERROR: terraform/$TF_FILE not found"
            echo ""
            echo "Available TF files:"
            find terraform -maxdepth 1 -name "*.tf" || true
            exit 1
          fi

          echo "Terraform file exists."

      # ───────────────────────────────────────────────────────────────────────
      # Build isolated workspace
      # ───────────────────────────────────────────────────────────────────────
      - name: Build isolated workspace
        shell: bash
        run: |
          set -x

          echo "Current directory:"
          pwd

          echo "TF_FILE=$TF_FILE"
          echo "WS_DIR=$WS_DIR"

          mkdir -p "$WS_DIR"

          if [[ ! -f "terraform/$TF_FILE" ]]; then
            echo "ERROR: terraform/$TF_FILE not found"

            echo ""
            echo "All repository files:"
            find . -type f | sort

            exit 1
          fi

          echo "Copying main TF file..."
          cp "terraform/$TF_FILE" "$WS_DIR/"

          echo "Copying shared TF files..."
          for shared in provider.tf versions.tf variables.tf; do
            if [[ -f "terraform/$shared" && "$shared" != "$TF_FILE" ]]; then
              cp "terraform/$shared" "$WS_DIR/"
            fi
          done

          echo "Copying tfvars files..."

          shopt -s nullglob

          for tfvars in terraform/*.tfvars terraform/*.tfvars.json; do
            cp "$tfvars" "$WS_DIR/"
          done

          shopt -u nullglob

          echo ""
          echo "Workspace contents:"
          ls -lah "$WS_DIR/"

      # ───────────────────────────────────────────────────────────────────────
      # Install Azure CLI
      # ───────────────────────────────────────────────────────────────────────
      - name: Install Azure CLI
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      # ───────────────────────────────────────────────────────────────────────
      # Setup Terraform
      # ───────────────────────────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.7

      # ───────────────────────────────────────────────────────────────────────
      # Azure Login
      # ───────────────────────────────────────────────────────────────────────
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":"${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":"${{ secrets.AZURE_TENANT_ID }}"
            }

      # ───────────────────────────────────────────────────────────────────────
      # Bootstrap backend
      # ───────────────────────────────────────────────────────────────────────
      - name: Bootstrap backend
        shell: bash
        run: |
          set -e

          az group create \
            --name "$BACKEND_RG" \
            --location westeurope

          az storage account create \
            --resource-group "$BACKEND_RG" \
            --name "$BACKEND_SA" \
            --sku Standard_LRS \
            --kind StorageV2 \
            --location westeurope

          ACCOUNT_KEY=$(az storage account keys list \
            --resource-group "$BACKEND_RG" \
            --account-name "$BACKEND_SA" \
            --query '[0].value' \
            --output tsv)

          az storage container create \
            --name "$BACKEND_CONTAINER" \
            --account-name "$BACKEND_SA" \
            --account-key "$ACCOUNT_KEY"

      # ───────────────────────────────────────────────────────────────────────
      # Terraform Init
      # ───────────────────────────────────────────────────────────────────────
      - name: Terraform init
        working-directory: ${{ env.WS_DIR }}
        shell: bash
        run: |
          set -e

          STATE_KEY="${TF_FILE%.tf}.tfstate"

          terraform init -reconfigure \
            -backend-config="resource_group_name=$BACKEND_RG" \
            -backend-config="storage_account_name=$BACKEND_SA" \
            -backend-config="container_name=$BACKEND_CONTAINER" \
            -backend-config="key=$STATE_KEY"

      # ───────────────────────────────────────────────────────────────────────
      # Terraform Format
      # ───────────────────────────────────────────────────────────────────────
      - name: Terraform format
        working-directory: ${{ env.WS_DIR }}
        shell: bash
        run: terraform fmt -recursive

      # ───────────────────────────────────────────────────────────────────────
      # Terraform Validate
      # ───────────────────────────────────────────────────────────────────────
      - name: Terraform validate
        working-directory: ${{ env.WS_DIR }}
        shell: bash
        run: terraform validate

      # ───────────────────────────────────────────────────────────────────────
      # Terraform Plan
      # ───────────────────────────────────────────────────────────────────────
      - name: Terraform plan
        working-directory: ${{ env.WS_DIR }}
        shell: bash
        run: |
          set -e

          if [[ "$ACTION" == "destroy" ]]; then
            terraform plan -destroy -out=plan.tfplan
          else
            terraform plan -out=plan.tfplan
          fi

      # ───────────────────────────────────────────────────────────────────────
      # Artifact name
      # ───────────────────────────────────────────────────────────────────────
      - name: Set artifact name
        id: artifact-name
        shell: bash
        run: |
          ARTIFACT="tfplan-${{ github.run_id }}-${TF_FILE%.tf}"
          echo "value=$ARTIFACT" >> "$GITHUB_OUTPUT"

      # ───────────────────────────────────────────────────────────────────────
      # Upload plan
      # ───────────────────────────────────────────────────────────────────────
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.value }}
          path: ${{ env.WS_DIR }}/plan.tfplan
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# APPLY / DESTROY
# ─────────────────────────────────────────────────────────────────────────────
  apply:
    name: Terraform Apply/Destroy
    runs-on: ubuntu-latest

    needs: plan

    if: github.event.inputs.action != 'plan'

    environment: ${{ github.event.inputs.action }}

    steps:

      # ───────────────────────────────────────────────────────────────────────
      # Checkout
      # ───────────────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ───────────────────────────────────────────────────────────────────────
      # Build workspace
      # ───────────────────────────────────────────────────────────────────────
      - name: Build isolated workspace
        shell: bash
        run: |
          set -x

          mkdir -p "$WS_DIR"

          cp "terraform/$TF_FILE" "$WS_DIR/"

          for shared in provider.tf versions.tf variables.tf; do
            if [[ -f "terraform/$shared" && "$shared" != "$TF_FILE" ]]; then
              cp "terraform/$shared" "$WS_DIR/"
            fi
          done

          shopt -s nullglob

          for tfvars in terraform/*.tfvars terraform/*.tfvars.json; do
            cp "$tfvars" "$WS_DIR/"
          done

          shopt -u nullglob

          ls -lah "$WS_DIR/"

      # ───────────────────────────────────────────────────────────────────────
      # Install Azure CLI
      # ───────────────────────────────────────────────────────────────────────
      - name: Install Azure CLI
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      # ───────────────────────────────────────────────────────────────────────
      # Setup Terraform
      # ───────────────────────────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.7

      # ───────────────────────────────────────────────────────────────────────
      # Azure Login
      # ───────────────────────────────────────────────────────────────────────
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":"${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":"${{ secrets.AZURE_TENANT_ID }}"
            }

      # ───────────────────────────────────────────────────────────────────────
      # Download Plan
      # ───────────────────────────────────────────────────────────────────────
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.artifact-name }}
          path: ${{ env.WS_DIR }}

      # ───────────────────────────────────────────────────────────────────────
      # Terraform Init
      # ───────────────────────────────────────────────────────────────────────
      - name: Terraform init
        working-directory: ${{ env.WS_DIR }}
        shell: bash
        run: |
          set -e

          STATE_KEY="${TF_FILE%.tf}.tfstate"

          terraform init -reconfigure \
            -backend-config="resource_group_name=$BACKEND_RG" \
            -backend-config="storage_account_name=$BACKEND_SA" \
            -backend-config="container_name=$BACKEND_CONTAINER" \
            -backend-config="key=$STATE_KEY"

      # ───────────────────────────────────────────────────────────────────────
      # Terraform Apply
      # ───────────────────────────────────────────────────────────────────────
      - name: Terraform apply
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.WS_DIR }}
        shell: bash
        run: terraform apply -auto-approve plan.tfplan

      # ───────────────────────────────────────────────────────────────────────
      # Terraform Destroy
      # ───────────────────────────────────────────────────────────────────────
      - name: Terraform destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: ${{ env.WS_DIR }}
        shell: bash
        run: terraform apply -auto-approve plan.tfplan
