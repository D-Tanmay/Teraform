name: CI

on:
  push:
    branches: [ 'main4' ]
  pull_request:
    branches: [ 'main4' ]
  workflow_dispatch:
    inputs:
      run_apply:
        description: 'Run terraform apply after plan'
        required: false
        default: 'false'
      run_destroy:
        description: 'Run terraform destroy'
        required: false
        default: 'false'

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: '1.9.7'

    - name: Check Azure secrets
      run: |
        if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ]; then echo 'Missing AZURE_CLIENT_ID'; exit 1; fi
        if [ -z "${{ secrets.AZURE_CLIENT_SECRET }}" ]; then echo 'Missing AZURE_CLIENT_SECRET'; exit 1; fi
        if [ -z "${{ secrets.AZURE_TENANT_ID }}" ]; then echo 'Missing AZURE_TENANT_ID'; exit 1; fi
        if [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then echo 'Missing AZURE_SUBSCRIPTION_ID'; exit 1; fi

    - name: Debug secret presence
      run: |
        echo "Tenant set:       ${{ secrets.AZURE_TENANT_ID != '' }}"
        echo "Client ID set:    ${{ secrets.AZURE_CLIENT_ID != '' }}"
        echo "Client Secret set:${{ secrets.AZURE_CLIENT_SECRET != '' }}"
        echo "Subscription set: ${{ secrets.AZURE_SUBSCRIPTION_ID != '' }}"

    - name: Azure login
      shell: bash
      run: |
        az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
        az account set --subscription "$AZURE_SUBSCRIPTION_ID"
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Terraform init
      working-directory: Terraform
      run: terraform init -reconfigure

    - name: Terraform validate
      working-directory: Terraform
      run: terraform validate

    - name: Terraform plan
      working-directory: Terraform
      run: terraform plan -out=plan.tfplan

    - name: Upload plan artifact
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan
        path: Terraform/plan.tfplan

  apply:
    name: Terraform Apply
    needs: plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_apply == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: '1.9.7'

    - name: Check Azure secrets
      run: |
        if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ]; then echo 'Missing AZURE_CLIENT_ID'; exit 1; fi
        if [ -z "${{ secrets.AZURE_CLIENT_SECRET }}" ]; then echo 'Missing AZURE_CLIENT_SECRET'; exit 1; fi
        if [ -z "${{ secrets.AZURE_TENANT_ID }}" ]; then echo 'Missing AZURE_TENANT_ID'; exit 1; fi
        if [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then echo 'Missing AZURE_SUBSCRIPTION_ID'; exit 1; fi

    - name: Debug secret presence
      run: |
        echo "Tenant set:        ${{ secrets.AZURE_TENANT_ID != '' }}"
        echo "Client ID set:     ${{ secrets.AZURE_CLIENT_ID != '' }}"
        echo "Client Secret set: ${{ secrets.AZURE_CLIENT_SECRET != '' }}"
        echo "Subscription set:  ${{ secrets.AZURE_SUBSCRIPTION_ID != '' }}"

    - name: Azure login
      shell: bash
      run: |
        az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
        az account set --subscription "$AZURE_SUBSCRIPTION_ID"
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Download plan artifact
      uses: actions/download-artifact@v4
      with:
        name: terraform-plan
        path: Terraform

    - name: Terraform apply
      working-directory: Terraform
      run: terraform apply -auto-approve plan.tfplan

  destroy:
    name: Terraform Destroy
    needs: plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_destroy == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: '1.9.7'

    - name: Check Azure secrets
      run: |
        if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ]; then echo 'Missing AZURE_CLIENT_ID'; exit 1; fi
        if [ -z "${{ secrets.AZURE_CLIENT_SECRET }}" ]; then echo 'Missing AZURE_CLIENT_SECRET'; exit 1; fi
        if [ -z "${{ secrets.AZURE_TENANT_ID }}" ]; then echo 'Missing AZURE_TENANT_ID'; exit 1; fi
        if [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then echo 'Missing AZURE_SUBSCRIPTION_ID'; exit 1; fi

    - name: Debug secret presence
      run: |
        echo "Tenant set:        ${{ secrets.AZURE_TENANT_ID != '' }}"
        echo "Client ID set:     ${{ secrets.AZURE_CLIENT_ID != '' }}"
        echo "Client Secret set: ${{ secrets.AZURE_CLIENT_SECRET != '' }}"
        echo "Subscription set:  ${{ secrets.AZURE_SUBSCRIPTION_ID != '' }}"

    - name: Azure login
      shell: bash
      run: |
        az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
        az account set --subscription "$AZURE_SUBSCRIPTION_ID"
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Terraform init
      working-directory: Terraform
      run: terraform init -reconfigure

    - name: Terraform destroy
      working-directory: Terraform
      run: terraform destroy -auto-approve
