name: CI

on:
  push:
    branches: [ 'main4' ]
  pull_request:
    branches: [ 'main4' ]
  workflow_dispatch:
    inputs:
      run_apply:
        description: 'Run terraform apply after plan'
        required: false
        default: 'false'
      run_destroy:
        description: 'Run terraform destroy'
        required: false
        default: 'false'

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: '1.9.7'

    - name: Check Azure secrets
      run: |
        if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ]; then echo 'Missing AZURE_CLIENT_ID'; exit 1; fi
        if [ -z "${{ secrets.AZURE_CLIENT_SECRET }}" ]; then echo 'Missing AZURE_CLIENT_SECRET'; exit 1; fi
        if [ -z "${{ secrets.AZURE_TENANT_ID }}" ]; then echo 'Missing AZURE_TENANT_ID'; exit 1; fi
        if [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then echo 'Missing AZURE_SUBSCRIPTION_ID'; exit 1; fi

    - name: Debug secret presence
      run: |
        echo "Tenant set:       ${{ secrets.AZURE_TENANT_ID != '' }}"
        echo "Client ID set:    ${{ secrets.AZURE_CLIENT_ID != '' }}"
        echo "Client Secret set:${{ secrets.AZURE_CLIENT_SECRET != '' }}"
        echo "Subscription set: ${{ secrets.AZURE_SUBSCRIPTION_ID != '' }}"

    - name: Azure login
      shell: bash
      run: |
        az login --service-principal -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" --tenant "$ARM_TENANT_ID"
        az account set --subscription "$ARM_SUBSCRIPTION_ID"

    - name: Bootstrap Terraform backend
      shell: bash
      run: |
        RESOURCE_GROUP="tfstate-day04"
        STORAGE_ACCOUNT="day0417691"
        CONTAINER="tfstate"
        LOCATION="westeurope"

        # Create resource group if it doesn't exist
        if ! az group show --name "$RESOURCE_GROUP" &>/dev/null; then
          echo "Creating resource group: $RESOURCE_GROUP"
          az group create --name "$RESOURCE_GROUP" --location "$LOCATION"
        else
          echo "Resource group already exists: $RESOURCE_GROUP"
        fi

        # Create storage account if it doesn't exist
        if ! az storage account show --name "$STORAGE_ACCOUNT" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
          echo "Creating storage account: $STORAGE_ACCOUNT"
          az storage account create \
            --name "$STORAGE_ACCOUNT" \
            --resource-group "$RESOURCE_GROUP" \
            --location "$LOCATION" \
            --sku Standard_LRS \
            --encryption-services blob
        else
          echo "Storage account already exists: $STORAGE_ACCOUNT"
        fi

        # Create blob container if it doesn't exist
        if ! az storage container show --name "$CONTAINER" --account-name "$STORAGE_ACCOUNT" &>/dev/null; then
          echo "Creating container: $CONTAINER"
          az storage container create \
            --name "$CONTAINER" \
            --account-name "$STORAGE_ACCOUNT" \
            --auth-mode login
        else
          echo "Container already exists: $CONTAINER"
        fi

    - name: Terraform init
      working-directory: Terraform
      run: terraform init -reconfigure

    - name: Terraform validate
      working-directory: Terraform
      run: terraform validate

    - name: Terraform plan
      working-directory: Terraform
      run: terraform plan -out=plan.tfplan

    - name: Upload plan artifact
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan
        path: Terraform/plan.tfplan

  apply:
    name: Terraform Apply
    needs: plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_apply == 'true'
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: '1.9.7'

    - name: Check Azure secrets
      run: |
        if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ]; then echo 'Missing AZURE_CLIENT_ID'; exit 1; fi
        if [ -z "${{ secrets.AZURE_CLIENT_SECRET }}" ]; then echo 'Missing AZURE_CLIENT_SECRET'; exit 1; fi
        if [ -z "${{ secrets.AZURE_TENANT_ID }}" ]; then echo 'Missing AZURE_TENANT_ID'; exit 1; fi
        if [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then echo 'Missing AZURE_SUBSCRIPTION_ID'; exit 1; fi

    - name: Debug secret presence
      run: |
        echo "Tenant set:        ${{ secrets.AZURE_TENANT_ID != '' }}"
        echo "Client ID set:     ${{ secrets.AZURE_CLIENT_ID != '' }}"
        echo "Client Secret set: ${{ secrets.AZURE_CLIENT_SECRET != '' }}"
        echo "Subscription set:  ${{ secrets.AZURE_SUBSCRIPTION_ID != '' }}"

    - name: Azure login
      shell: bash
      run: |
        az login --service-principal -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" --tenant "$ARM_TENANT_ID"
        az account set --subscription "$ARM_SUBSCRIPTION_ID"

    - name: Bootstrap Terraform backend
      shell: bash
      run: |
        RESOURCE_GROUP="tfstate-day04"
        STORAGE_ACCOUNT="day0417691"
        CONTAINER="tfstate"
        LOCATION="westeurope"

        if ! az group show --name "$RESOURCE_GROUP" &>/dev/null; then
          az group create --name "$RESOURCE_GROUP" --location "$LOCATION"
        fi
        if ! az storage account show --name "$STORAGE_ACCOUNT" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
          az storage account create \
            --name "$STORAGE_ACCOUNT" \
            --resource-group "$RESOURCE_GROUP" \
            --location "$LOCATION" \
            --sku Standard_LRS \
            --encryption-services blob
        fi
        if ! az storage container show --name "$CONTAINER" --account-name "$STORAGE_ACCOUNT" &>/dev/null; then
          az storage container create \
            --name "$CONTAINER" \
            --account-name "$STORAGE_ACCOUNT" \
            --auth-mode login
        fi

    - name: Terraform init
      working-directory: Terraform
      run: terraform init -reconfigure

    - name: Download plan artifact
      uses: actions/download-artifact@v4
      with:
        name: terraform-plan
        path: Terraform

    - name: Terraform apply
      working-directory: Terraform
      run: terraform apply -auto-approve plan.tfplan

  destroy:
    name: Terraform Destroy
    needs: plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_destroy == 'true'
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: '1.9.7'

    - name: Check Azure secrets
      run: |
        if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ]; then echo 'Missing AZURE_CLIENT_ID'; exit 1; fi
        if [ -z "${{ secrets.AZURE_CLIENT_SECRET }}" ]; then echo 'Missing AZURE_CLIENT_SECRET'; exit 1; fi
        if [ -z "${{ secrets.AZURE_TENANT_ID }}" ]; then echo 'Missing AZURE_TENANT_ID'; exit 1; fi
        if [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then echo 'Missing AZURE_SUBSCRIPTION_ID'; exit 1; fi

    - name: Debug secret presence
      run: |
        echo "Tenant set:        ${{ secrets.AZURE_TENANT_ID != '' }}"
        echo "Client ID set:     ${{ secrets.AZURE_CLIENT_ID != '' }}"
        echo "Client Secret set: ${{ secrets.AZURE_CLIENT_SECRET != '' }}"
        echo "Subscription set:  ${{ secrets.AZURE_SUBSCRIPTION_ID != '' }}"

    - name: Azure login
      shell: bash
      run: |
        az login --service-principal -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" --tenant "$ARM_TENANT_ID"
        az account set --subscription "$ARM_SUBSCRIPTION_ID"

    - name: Bootstrap Terraform backend
      shell: bash
      run: |
        RESOURCE_GROUP="tfstate-day04"
        STORAGE_ACCOUNT="day0417691"
        CONTAINER="tfstate"
        LOCATION="westeurope"

        if ! az group show --name "$RESOURCE_GROUP" &>/dev/null; then
          az group create --name "$RESOURCE_GROUP" --location "$LOCATION"
        fi
        if ! az storage account show --name "$STORAGE_ACCOUNT" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
          az storage account create \
            --name "$STORAGE_ACCOUNT" \
            --resource-group "$RESOURCE_GROUP" \
            --location "$LOCATION" \
            --sku Standard_LRS \
            --encryption-services blob
        fi
        if ! az storage container show --name "$CONTAINER" --account-name "$STORAGE_ACCOUNT" &>/dev/null; then
          az storage container create \
            --name "$CONTAINER" \
            --account-name "$STORAGE_ACCOUNT" \
            --auth-mode login
        fi

    - name: Terraform init
      working-directory: Terraform
      run: terraform init -reconfigure

    - name: Terraform destroy
      working-directory: Terraform
      run: terraform destroy -auto-approve
